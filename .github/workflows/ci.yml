name: Docker Compose Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for healthy status
        run: |
          echo "Waiting for services to become healthy..."
          # Ждем суммарно до 60 секунд (30 попыток по 2 секунды)
          for i in {1..30}; do
            # Проверяем вывод docker compose ps на наличие слова "healthy" для обоих сервисов
            HEALTHY_COUNT=$(docker compose ps --status=healthy --format "{{.Service}}" | wc -l)
            
            echo "Attempt $i/30: Healthy services count = $HEALTHY_COUNT (need 2)"
            
            if [ "$HEALTHY_COUNT" -eq 2 ]; then
              echo "Both services are healthy!"
              exit 0
            fi
            
            sleep 2
          done
          
          echo "Timeout reached! Printing container logs for debugging:"
          docker compose logs
          exit 1

      - name: Test HTTP endpoints
        run: |
          curl -f http://localhost/nginx-health
          curl -f http://localhost/

      - name: Tear down
        if: always()
        run: docker compose down -v