name: Docker Compose Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to start
        run: |
          echo "Waiting for services to respond..."
          # Ждем до 30 секунд, пока веб-серверы начнут отвечать
          for i in {1..15}; do
            if curl -s http://localhost/nginx-health | grep -q "healthy"; then
              echo "Nginx is up and healthy!"
              break
            fi
            echo "Attempt $i/15: Nginx is not ready yet..."
            sleep 2
          done

      - name: Test HTTP endpoints
        run: |
          echo "Testing /nginx-health:"
          curl -v -f http://localhost/nginx-health
          
          echo "Testing root /:"
          curl -v -f http://localhost/

      - name: Tear down
        if: always()
        run: |
          if [ "${{ job.status }}" == 'failure' ]; then
            echo "Printing container logs due to failure:"
            docker compose logs
          fi
          docker compose down -v