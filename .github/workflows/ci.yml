name: Docker Compose Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for healthy status
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..20}; do
            # Проверяем состояние здоровья всех запущенных контейнеров проекта
            UNHEALTHY_COUNT=$(docker compose ps -q | xargs -I {} docker inspect --format='{{if .State.Health}}{{if ne .State.Health.Status "healthy"}}1{{end}}{{else}}1{{end}}' {} | wc -l)
            RUNNING_COUNT=$(docker compose ps -q | wc -l)
            
            if [ "$RUNNING_COUNT" -gt 0 ] && [ "$UNHEALTHY_COUNT" -eq 0 ]; then
              # Дополнительно убедимся через цикл, что статус именно healthy, а не просто нет healthcheck
              ALL_HEALTHY=true
              for id in $(docker compose ps -q); do
                STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no_healthcheck{{end}}' $id)
                if [ "$STATUS" != "healthy" ]; then
                  ALL_HEALTHY=false
                fi
              done
              
              if [ "$ALL_HEALTHY" = true ]; then
                echo "All services are healthy!"
                exit 0
              fi
            fi
            
            echo "Attempt $i/20: Services are starting..."
            sleep 3
          done
          
          echo "Timeout reached! Printing container logs for debugging:"
          docker compose logs
          exit 1

      - name: Test HTTP endpoints
        run: |
          curl -f http://localhost/nginx-health
          curl -f http://localhost/

      - name: Tear down
        if: always()
        run: docker compose down -v